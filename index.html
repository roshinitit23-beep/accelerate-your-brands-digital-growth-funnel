            <div className="glass-panel p-6 space-y-4 max-w-2xl mx-auto">

              <div className="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
                <div className="h-44 bg-gradient-to-r from-indigo-900 via-purple-900 to-pink-900 p-4 rounded-lg flex flex-col justify-between">

      const score = (title.length >= 30 && title.length <= 65 ? 40 : 20) + (desc.length >= 120 && desc.length <= 160 ? 40 : 20) + 20;

      return (
        <div className="space-y-6 animate-fade-in">
          <div className="border-b border-slate-800 pb-4">
            <span className="badge-indigo">Module 2</span>
            <h2 className="text-2xl font-bold text-white mt-1">On-Page SEO Analyzer & Keyword Matrix</h2>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div className="lg:col-span-7 glass-panel p-6 space-y-4">

                      <td className="p-3"><span className="badge-indigo text-[10px]">{k.intent}</span></td>

    // 5. CRM View
    function CRMView({ leads, onUpdateStatus, onDelete, onAddLead }) {
      const [search, setSearch] = useState('');
      const filtered = leads.filter(l => l.Full_Name.toLowerCase().includes(search.toLowerCase()) || l.Email_Address.toLowerCase().includes(search.toLowerCase()));

      const exportCSV = () => {
        const rows = ['Lead_ID,Full_Name,Email_Address,Phone_Number,Traffic_Source,Conversion_Status,Submission_Date', ...leads.map(l => `${l.Lead_ID},"${l.Full_Name}",${l.Email_Address},${l.Phone_Number},"${l.Traffic_Source}",${l.Conversion_Status},"${l.Submission_Date}"`)].join('\n');
        const link = document.createElement('a');
        link.href = 'data:text/csv;charset=utf-8,' + encodeURI(rows);
        link.download = 'Lead_Database_Schema_Export.csv';
        link.click();
      };

      return (
        <div className="space-y-6 animate-fade-in">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-800 pb-4">

            <input type="text" placeholder="Search leads by name or email..." value={search} onChange={e => setSearch(e.target.value)} className="glass-input w-full text-xs max-w-sm" />

            <table className="w-full text-left text-xs">

              </thead>
              <tbody className="divide-y divide-slate-800">
                {filtered.map(l => (
                  <tr key={l.Lead_ID}>
                    <td className="p-3 font-mono text-indigo-400 font-bold">{l.Lead_ID}</td>
                    <td className="p-3 font-semibold text-white">{l.Full_Name}</td>
                    <td className="p-3 font-mono text-slate-300">{l.Email_Address}<br/><span className="text-slate-500 text-[10px]">{l.Phone_Number}</span></td>
                    <td className="p-3"><span className="badge-indigo text-[10px]">{l.Traffic_Source}</span></td>
                    <td className="p-3">
                      <select value={l.Conversion_Status} onChange={e => onUpdateStatus(l.Lead_ID, e.target.value)} className="bg-slate-900 text-xs border border-slate-700 rounded p-1 text-slate-200">

    }
